<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מפת פנים לשאלון</title>
<style>
  /* שנו את הצבעים כאן כדי להתאים למותג של הקליניקה */
  :root{
    --accent:#b8756a;
    --accent-soft:rgba(184,117,106,.22);
    --accent-strong:rgba(184,117,106,.62);
    --skin:#f6e3d8;
    --skin-line:#c99a8b;
    --hair:#d9c3b5;
    --ink:#3a2e2b;
    --muted:#7d6d68;
    --bg:#fffaf7;
    --chip:#f3e4dd;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Heebo","Assistant",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
  .face-map{max-width:880px;margin:0 auto;padding:20px 16px 28px;display:grid;gap:20px;grid-template-columns:minmax(0,360px) minmax(0,1fr);align-items:start}
  @media (max-width:700px){.face-map{grid-template-columns:1fr}}
  h2{margin:0 0 6px;font-size:1.25rem;font-weight:600}
  .hint{margin:0 0 14px;color:var(--muted);font-size:.95rem;line-height:1.5}
  svg{width:100%;height:auto;display:block;touch-action:manipulation;border-radius:16px;overflow:hidden}
  .zone{cursor:pointer;outline:none}
  .zone .area{fill:rgba(255,255,255,.08);stroke:rgba(255,255,255,.75);stroke-width:2.5;stroke-dasharray:7 6;transition:fill .15s,stroke .15s}
  .zone:hover .area,.zone:focus-visible .area{fill:rgba(255,255,255,.28);stroke:#fff;stroke-dasharray:none}
  .zone[aria-checked="true"] .area{fill:var(--accent-strong);stroke:#fff;stroke-dasharray:none}
  .zone:focus-visible .area{stroke-width:3}
  .current{min-height:1.6em;margin:6px 0 0;text-align:center;color:var(--accent);font-weight:600;font-size:.95rem}
  .panel h3{margin:0 0 10px;font-size:1rem;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:8px;min-height:44px;margin:0 0 14px;padding:0;list-style:none}
  .chips li{background:var(--chip);border-radius:999px;padding:6px 14px;font-size:.92rem}
  .empty{color:var(--muted);font-size:.92rem}
  .list{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:0 0 16px}
  .list button{font:inherit;font-size:.92rem;padding:9px 10px;border:1px solid var(--skin-line);background:#fff;color:var(--ink);border-radius:10px;cursor:pointer;text-align:center}
  .list button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
  .clear{font:inherit;background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;padding:4px 0}
  .note{margin-top:14px;font-size:.8rem;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<form class="face-map" onsubmit="return false">

    <p class="current" id="current" aria-live="polite"></p>
  </div>

  <div class="panel">
    <h3>האזורים שבחרת</h3>
    <ul class="chips" id="chips"><li class="empty">עדיין לא נבחרו אזורים</li></ul>

    <h3>או בחרי מהרשימה</h3>
    <div class="list" id="list"></div>

    <input type="hidden" name="face_zones" id="face_zones" value="">
    <button type="button" class="clear" id="clear">נקה בחירה</button>
    <p class="note">האיור להמחשה בלבד ואינו מהווה אבחנה או המלצה רפואית. ההתאמה לטיפול תיעשה בייעוץ אישי.</p>
  </div>
</form>

<script>
(function(){
  var zones = Array.prototype.slice.call(document.querySelectorAll('.zone'));
  var chips = document.getElementById('chips');
  var list = document.getElementById('list');
  var field = document.getElementById('face_zones');
  var current = document.getElementById('current');
  var selected = {};

  // כפתורי רשימה (חלופה נגישה ללחיצה על האיור)
  zones.forEach(function(z){
    var b = document.createElement('button');
    b.type = 'button';
    b.textContent = z.dataset.label;
    b.setAttribute('aria-pressed','false');
    b.dataset.id = z.dataset.id;
    b.addEventListener('click', function(){ toggle(z.dataset.id); });
    list.appendChild(b);

    z.addEventListener('click', function(){ toggle(z.dataset.id); });
    z.addEventListener('keydown', function(e){
      if(e.key === ' ' || e.key === 'Enter'){ e.preventDefault(); toggle(z.dataset.id); }
    });
    z.addEventListener('mouseenter', function(){ current.textContent = z.dataset.label; });
    z.addEventListener('focus', function(){ current.textContent = z.dataset.label; });
    z.addEventListener('mouseleave', function(){ current.textContent = ''; });
    z.addEventListener('blur', function(){ current.textContent = ''; });
  });

  document.getElementById('clear').addEventListener('click', function(){
    selected = {}; render();
  });

  function toggle(id){
    if(selected[id]) delete selected[id]; else selected[id] = true;
    render();
  }

  function render(){
    var ids = [], labels = [];
    zones.forEach(function(z){
      var on = !!selected[z.dataset.id];
      z.setAttribute('aria-checked', on);
      if(on){ ids.push(z.dataset.id); labels.push(z.dataset.label); }
    });
    Array.prototype.forEach.call(list.children, function(b){
      b.setAttribute('aria-pressed', !!selected[b.dataset.id]);
    });
    chips.innerHTML = '';
    if(!labels.length){
      var li = document.createElement('li'); li.className = 'empty';
      li.textContent = 'עדיין לא נבחרו אזורים'; chips.appendChild(li);
    } else {
      labels.forEach(function(t){
        var li = document.createElement('li'); li.textContent = t; chips.appendChild(li);
      });
    }
    // הערך לשליחה עם השאלון: מזהים באנגלית מופרדים בפסיק
    field.value = ids.join(',');
    var detail = { ids: ids, labels: labels };
    document.dispatchEvent(new CustomEvent('etel:zones', { detail: detail }));
    // כשהעמוד מוטמע ב-iframe, שולח את הבחירה לעמוד האב
    if(window.parent !== window){ window.parent.postMessage({ type:'etel:zones', ids:ids, labels:labels }, '*'); }
  }
  render();
})();
</script>
</body>
</html>
