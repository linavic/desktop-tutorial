name: Daily Netanya news

on:
  schedule:
    # GitHub fires scheduled runs hours late. Several slots, and a run posts only if it is 20:00 Israel time
    # or later and today has not been posted yet, so the first slot that fires late enough does the job.
    - cron: "0 17 * * *"
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if today was already handled"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -q && sudo apt-get install -y -q libraqm0
      - run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
          PUBLISH_TARGETS: ${{ vars.PUBLISH_TARGETS }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          ASBIZ_WEBHOOK_URL: ${{ secrets.ASBIZ_WEBHOOK_URL }}
          ASBIZ_TOKEN: ${{ secrets.ASBIZ_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m netanya_news.main ${{ inputs.force && '--force' || '' }}
          else
            python -m netanya_news.main --not-before-hour 20
          fi
      - name: Save state
        if: always()
        run: |
          git config user.name "netanya-news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/posted.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "state: daily run"
          for i in 1 2 3; do
            git pull --rebase origin main && git push && exit 0
            sleep 3
          done
          exit 1
