name: Daily Netanya news

on:
  schedule:
    # Two UTC slots so that 20:00 Israel time is hit in both summer (UTC+3) and winter (UTC+2);
    # --only-at-hour makes only the right one actually run.
    - cron: "0 17 * * *"
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Run even if today was already handled"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update -q && sudo apt-get install -y -q libraqm0
      - run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PUBLISH_MODE: ${{ vars.PUBLISH_MODE || 'draft' }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            python -m netanya_news.main ${{ inputs.force && '--force' || '' }}
          else
            python -m netanya_news.main --only-at-hour 20
          fi
      - name: Save state
        if: always()
        run: |
          git config user.name "netanya-news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/posted.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "state: daily run" && git push)
